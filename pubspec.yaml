name: smart_study_planner_app
description: 'A complete study planning app with 8 modules.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod: ^3.1.0

  # Navigation
  go_router: ^17.0.1

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # HTTP
  dio: ^5.3.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.20.2
  logger: ^2.0.0
  get_it: ^9.2.0

  # UI
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
